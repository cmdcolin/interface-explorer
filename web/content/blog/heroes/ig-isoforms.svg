<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" font-family="Open Sans, Helvetica, Arial, sans-serif">
<rect width="1600" height="760" fill="#fcfcfb"/>
<text x="800" y="56" font-size="40" text-anchor="middle" fill="#0b0b0b">A leukaemia therapy aims at one piece of CD22.</text>
<text x="800" y="102" font-size="40" text-anchor="middle" fill="#c42c2c">Some patients' cancer cells make a version without it.</text>
<rect x="60" y="585" width="1480" height="50" rx="18" fill="#bdb8ab"/>
<text x="800" y="619" font-size="28" text-anchor="middle" fill="#0b0b0b">cell surface</text>
<text x="470" y="162" font-size="32" text-anchor="middle" fill="#0b0b0b">Full-length CD22</text>
<rect x="375.0" y="185" width="190" height="50" rx="12" fill="#2a78d6"/>
<text x="470" y="219" font-size="28" text-anchor="middle" fill="#fff">domain 1</text>
<rect x="375.0" y="241" width="190" height="50" rx="12" fill="#2a78d6"/>
<text x="470" y="275" font-size="28" text-anchor="middle" fill="#fff">domain 2</text>
<rect x="375.0" y="297" width="190" height="50" rx="12" fill="#2a78d6"/>
<text x="470" y="331" font-size="28" text-anchor="middle" fill="#fff">domain 3</text>
<rect x="375.0" y="353" width="190" height="50" rx="12" fill="#2a78d6"/>
<text x="470" y="387" font-size="28" text-anchor="middle" fill="#fff">domain 4</text>
<rect x="375.0" y="409" width="190" height="50" rx="12" fill="#2a78d6"/>
<text x="470" y="443" font-size="28" text-anchor="middle" fill="#fff">domain 5</text>
<rect x="375.0" y="465" width="190" height="50" rx="12" fill="#2a78d6"/>
<text x="470" y="499" font-size="28" text-anchor="middle" fill="#fff">domain 6</text>
<rect x="375.0" y="521" width="190" height="50" rx="12" fill="#2a78d6"/>
<text x="470" y="555" font-size="28" text-anchor="middle" fill="#fff">domain 7</text>
<rect x="353.0" y="302.0" width="30" height="40" rx="9" fill="#e8890c"/>
<g transform=""><path d="M133.0 322.0 L263.0 322.0" stroke="#0b0b0b" stroke-width="16" stroke-linecap="round"/><path d="M349.0 304.0 L318.0 276.0 L263.0 322.0 L318.0 368.0 L349.0 340.0" stroke="#0b0b0b" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="349.0" cy="304.0" r="10" fill="#e8890c"/><circle cx="349.0" cy="340.0" r="10" fill="#e8890c"/></g>
<text x="125.0" y="292.0" font-size="26" fill="#0b0b0b">therapy</text>
<text x="290.0" y="406.0" font-size="26" text-anchor="middle" fill="#e8890c">epitope</text>
<text x="470" y="683" font-size="32" text-anchor="middle" fill="#3f9b78">therapy grabs domain 3<tspan fill="#0b0b0b">: cell is killed</tspan></text>
<text x="1200" y="162" font-size="32" text-anchor="middle" fill="#0b0b0b">Spliced CD22, found in leukaemia cells</text>
<rect x="1105.0" y="185" width="190" height="50" rx="12" fill="#2a78d6"/>
<text x="1200" y="219" font-size="28" text-anchor="middle" fill="#fff">domain 1</text>
<rect x="1105.0" y="241" width="190" height="50" rx="12" fill="#2a78d6"/>
<text x="1200" y="275" font-size="28" text-anchor="middle" fill="#fff">domain 2</text>
<rect x="1105.0" y="297" width="190" height="50" rx="12" fill="#fcfcfb" stroke="#7a7975" stroke-width="4" stroke-dasharray="14 10"/>
<text x="1200" y="331" font-size="26" text-anchor="middle" fill="#7a7975">spliced out</text>
<rect x="1105.0" y="353" width="190" height="50" rx="12" fill="#fcfcfb" stroke="#7a7975" stroke-width="4" stroke-dasharray="14 10"/>
<text x="1200" y="387" font-size="26" text-anchor="middle" fill="#7a7975">spliced out</text>
<rect x="1105.0" y="409" width="190" height="50" rx="12" fill="#2a78d6"/>
<text x="1200" y="443" font-size="28" text-anchor="middle" fill="#fff">domain 5</text>
<rect x="1105.0" y="465" width="190" height="50" rx="12" fill="#2a78d6"/>
<text x="1200" y="499" font-size="28" text-anchor="middle" fill="#fff">domain 6</text>
<rect x="1105.0" y="521" width="190" height="50" rx="12" fill="#2a78d6"/>
<text x="1200" y="555" font-size="28" text-anchor="middle" fill="#fff">domain 7</text>
<rect x="1083.0" y="302.0" width="30" height="40" rx="9" fill="none" stroke="#e8890c" stroke-width="4" stroke-dasharray="8 6"/>
<g transform="translate(-60 -28) rotate(-10 993.0 322.0)"><path d="M863.0 322.0 L993.0 322.0" stroke="#0b0b0b" stroke-width="16" stroke-linecap="round"/><path d="M1079.0 304.0 L1048.0 276.0 L993.0 322.0 L1048.0 368.0 L1079.0 340.0" stroke="#0b0b0b" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1079.0" cy="304.0" r="10" fill="#e8890c"/><circle cx="1079.0" cy="340.0" r="10" fill="#e8890c"/></g>
<text x="795.0" y="256.0" font-size="26" fill="#0b0b0b">therapy</text>
<text x="1020.0" y="406.0" font-size="26" text-anchor="middle" fill="#c42c2c">epitope gone</text>
<text x="1200" y="683" font-size="32" text-anchor="middle" fill="#c42c2c">nothing to grab<tspan fill="#0b0b0b">: cell escapes</tspan></text>
<text x="800" y="716" font-size="26" text-anchor="middle" fill="#52514e">Found in 16 of 18 childhood leukaemias tested, almost absent from normal B cells (Zheng et al. 2022)</text>
<text x="800" y="746" font-size="26" text-anchor="middle" fill="#52514e">so whether it matters depends on the patient&#8217;s tumour</text>
</svg>